<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A falling-sand cellular automaton written in Rust and compiled to WebAssembly."
    />
    <meta name="theme-color" content="#0b0b10" />
    <meta property="og:title" content="Sandboxed" />
    <meta
      property="og:description"
      content="A falling-sand cellular automaton written in Rust and compiled to WebAssembly."
    />
    <meta
      property="og:url"
      content="https://chowjiaming.github.io/sandboxed/"
    />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://chowjiaming.github.io/sandboxed/" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b10'/%3E%3Crect x='3' y='5' width='3' height='3' fill='%23c2a860'/%3E%3Crect x='7' y='8' width='3' height='3' fill='%23285ac8'/%3E%3Crect x='5' y='11' width='4' height='3' fill='%236e6e76'/%3E%3C/svg%3E"
    />
    <title>Sandboxed — Rust + WASM falling sand</title>
    <style>
      body {
        margin: 0;
        background: #0b0b10;
        color: #ddd;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #333;
        cursor: crosshair;
        touch-action: none;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #444;
        background: #1a1a24;
        color: #ddd;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button.active {
        border-color: #e0c060;
        background: #2a2a1a;
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid #0006;
        flex-shrink: 0;
      }
      label.brush {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      #fps {
        font-variant-numeric: tabular-nums;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Sandboxed</h1>
    <div class="bar" id="palette">
      <button data-mat="1" class="active">
        <span class="swatch" style="background: #c2a860"></span>Sand
      </button>
      <button data-mat="2">
        <span class="swatch" style="background: #285ac8"></span>Water
      </button>
      <button data-mat="3">
        <span class="swatch" style="background: #6e6e76"></span>Stone
      </button>
      <button data-mat="4">
        <span class="swatch" style="background: #ff7820"></span>Fire
      </button>
      <button data-mat="5">
        <span class="swatch" style="background: #764824"></span>Wood
      </button>
      <button data-mat="0">
        <span class="swatch" style="background: #1a1a24"></span>Erase
      </button>
    </div>
    <div class="bar">
      <label class="brush">
        Brush
        <input id="brush" type="range" min="1" max="8" value="3" />
        <span id="brush-val">3</span>
      </label>
      <button id="pause" aria-pressed="false">Pause</button>
      <button id="step">Step</button>
      <button id="clear">Clear</button>
    </div>
    <canvas id="view"></canvas>
    <div id="fps"></div>

    <script type="module">
      import init, { Simulation } from "./pkg/sandboxed.js";

      const W = 320;
      const H = 200;
      const SCALE = 3;

      const wasm = await init();

      const sim = new Simulation(W, H);
      const canvas = document.getElementById("view");
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = `${W * SCALE}px`;
      canvas.style.height = `${H * SCALE}px`;
      const ctx = canvas.getContext("2d");

      let material = 1;
      let brush = 3;
      let paused = false;
      let pendingStep = false;

      document
        .querySelectorAll("#palette button[data-mat]")
        .forEach((btn) => {
          btn.addEventListener("click", () => {
            material = Number(btn.dataset.mat);
            document
              .querySelectorAll("#palette button")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
          });
        });

      const brushInput = document.getElementById("brush");
      const brushVal = document.getElementById("brush-val");
      brushInput.addEventListener("input", () => {
        brush = Number(brushInput.value);
        brushVal.textContent = String(brush);
      });

      const pauseBtn = document.getElementById("pause");
      const setPaused = (next) => {
        paused = next;
        pauseBtn.classList.toggle("active", paused);
        pauseBtn.setAttribute("aria-pressed", String(paused));
        pauseBtn.textContent = paused ? "Resume" : "Pause";
      };
      pauseBtn.addEventListener("click", () => setPaused(!paused));
      document.getElementById("step").addEventListener("click", () => {
        setPaused(true);
        pendingStep = true;
      });
      document.getElementById("clear").addEventListener("click", () => {
        sim.clear();
      });

      window.addEventListener("keydown", (e) => {
        if (e.target instanceof HTMLInputElement) return;
        if (e.code === "Space") {
          e.preventDefault();
          setPaused(!paused);
        } else if (e.code === "Period") {
          setPaused(true);
          pendingStep = true;
        }
      });

      let painting = false;
      const toGrid = (e) => {
        const r = canvas.getBoundingClientRect();
        return [
          Math.floor(((e.clientX - r.left) / r.width) * W),
          Math.floor(((e.clientY - r.top) / r.height) * H),
        ];
      };
      const paintAt = (e) => {
        const [x, y] = toGrid(e);
        sim.paint(x, y, material, brush);
      };
      canvas.addEventListener("pointerdown", (e) => {
        painting = true;
        canvas.setPointerCapture(e.pointerId);
        paintAt(e);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!painting) return;
        paintAt(e);
      });
      canvas.addEventListener("pointerup", () => (painting = false));
      canvas.addEventListener("pointercancel", () => (painting = false));

      const fpsEl = document.getElementById("fps");
      let frames = 0;
      let last = performance.now();

      function blit() {
        // Re-create the view every frame: memory.buffer is
        // invalidated if WASM memory grows.
        const pixels = new Uint8ClampedArray(
          wasm.memory.buffer,
          sim.frame_ptr(),
          W * H * 4,
        );
        ctx.putImageData(new ImageData(pixels, W, H), 0, 0);
      }

      function loop() {
        if (!paused || pendingStep) {
          sim.tick();
          pendingStep = false;
        } else {
          sim.redraw();
        }
        blit();

        frames++;
        const now = performance.now();
        if (now - last >= 500) {
          fpsEl.textContent = paused
            ? "paused"
            : `${Math.round((frames * 1000) / (now - last))} fps`;
          frames = 0;
          last = now;
        }
        requestAnimationFrame(loop);
      }

      loop();
    </script>
  </body>
</html>
